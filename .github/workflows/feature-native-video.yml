name: Native Music video verification

on:
  push:
    branches:
      - feature/psp-replaces-ps1
    paths:
      - 'crates/slot/**'
      - 'crates/slot-gfx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/feature-native-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-video-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install project Rust toolchain
        run: rustup toolchain install 1.96 --profile minimal
      - name: Refresh lockfile for the new pinned decoder crates
        run: cargo +1.96 update --workspace
      - name: Check Slot native video under brick feature flags
        run: cargo +1.96 check -p slot --no-default-features --features brick
      - name: Run Slot library regressions (retry one timing-sensitive failure)
        run: |
          cargo +1.96 test -p slot --no-default-features --features sim --lib || cargo +1.96 test -p slot --no-default-features --features sim --lib
      - name: Generate H264/MP4 test videos locally
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=10' -f lavfi -i 'sine=frequency=880:sample_rate=44100' -t 3 -pix_fmt yuv420p -c:v libx264 -preset veryfast -profile:v baseline -x264-params 'bframes=0:keyint=10' -c:a aac /tmp/slot-baseline-h264.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=10' -t 3 -an -pix_fmt yuv420p -c:v libx264 -preset veryfast -profile:v main -x264-params 'bframes=2:keyint=10' /tmp/slot-main-bframes-h264.mp4
      - name: Decode real Baseline H264 MP4 frames
        env:
          SLOT_NATIVE_VIDEO_FIXTURE: /tmp/slot-baseline-h264.mp4
        run: cargo +1.96 test -p slot --no-default-features --features sim --lib music_video::tests::decodes_real_h264_mp4_fixture_with_presentation_timestamps -- --nocapture
      - name: Test movie controls and AAC soundtrack
        env:
          SLOT_NATIVE_VIDEO_SOUNDTRACK_FIXTURE: /tmp/slot-baseline-h264.mp4
        run: |
          cargo +1.96 test -p slot --no-default-features --features sim --lib music::tests::native_video_plays_its_embedded_soundtrack_from_the_start
          cargo +1.96 test -p slot --no-default-features --features sim --lib music::tests::now_playing_y_opens_video_and_leaves_the_song_paused_on_exit
      - name: Verify YUV colour and texture updates in OpenGL ES
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: cargo +1.96 test -p slot-gfx --no-default-features --features sim --test video
      - name: Decode real Main H264 B-frames
        env:
          SLOT_NATIVE_VIDEO_FIXTURE: /tmp/slot-main-bframes-h264.mp4
        run: cargo +1.96 test -p slot --no-default-features --features sim --lib music_video::tests::decodes_real_h264_mp4_fixture_with_presentation_timestamps -- --nocapture
      - name: Build Slot for actual ARM64 Brick target in Docker
        run: sh brick/docker-build.sh
      - name: Keep tested ARM64 executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slot-native-video-arm64
          path: dist-brick/Slot/System/slot
          if-no-files-found: error
      - name: Commit the verified Cargo.lock on the feature branch
        if: success()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Lock tested native H264 and MP4 dependencies"
            git push origin HEAD:refs/heads/feature/psp-replaces-ps1
          fi
      - name: Keep resolved dependency lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slot-native-video-cargo-lock
          path: Cargo.lock
